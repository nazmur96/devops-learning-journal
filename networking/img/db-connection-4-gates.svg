<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<style>.s{font-family:"Noto Sans",sans-serif}.m{font-family:"JetBrainsMono NF",monospace}</style>
<rect width="1080" height="1350" fill="#0b1220"/>
<text x="40" y="80" class="m" font-size="22" font-weight="700" fill="#ff9900" letter-spacing="3">AWS + POSTGRESQL · BEGINNER GUIDE</text>
<text x="40" y="156" class="s" font-size="60" font-weight="800" fill="#f8fafc">Can’t connect to</text>
<text x="40" y="226" class="s" font-size="60" font-weight="800" fill="#f8fafc">your database?</text>
<text x="40" y="280" class="s" font-size="27" fill="#94a3b8">4 gates, in order. The error tells you which one is stuck.</text>
<rect x="40" y="322" width="1000" height="196" rx="18" fill="#111c33" stroke="#ff9900" stroke-opacity="0.5" stroke-width="2"/>
<rect x="40" y="322" width="10" height="196" rx="5" fill="#ff9900"/>
<circle cx="100" cy="374" r="27" fill="#ff9900"/>
<text x="100" y="384" text-anchor="middle" class="s" font-size="28" font-weight="800" fill="#0b1220">1</text>
<text x="146" y="384" class="s" font-size="31" font-weight="700" fill="#f8fafc">Security group</text>
<text x="146" y="422" class="s" font-size="21" font-style="italic" fill="#94a3b8">The front gate lets you in</text>
<rect x="146" y="446" width="252" height="40" rx="8" fill="#ff9900" fill-opacity="0.13" stroke="#ff9900" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="160" y="472" class="m" font-size="19" fill="#e2e8f0">TCP 5432 from app-sg</text>
<rect x="600" y="352" width="416" height="136" rx="12" fill="#2a1418" stroke="#f87171" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="620" y="384" class="m" font-size="15" font-weight="700" fill="#f87171" letter-spacing="2">IF IT FAILS</text>
<text x="620" y="422" class="m" font-size="21" font-weight="700" fill="#fecaca">Connection timed out</text>
<text x="620" y="458" class="s" font-size="19" font-style="italic" fill="#fca5a5">waits, then gives up</text>
<path d="M92,520 L100,538 L108,520" fill="none" stroke="#475569" stroke-width="3"/>
<rect x="40" y="540" width="1000" height="196" rx="18" fill="#111c33" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="2"/>
<rect x="40" y="540" width="10" height="196" rx="5" fill="#60a5fa"/>
<circle cx="100" cy="592" r="27" fill="#60a5fa"/>
<text x="100" y="602" text-anchor="middle" class="s" font-size="28" font-weight="800" fill="#0b1220">2</text>
<text x="146" y="602" class="s" font-size="31" font-weight="700" fill="#f8fafc">PostgreSQL listening</text>
<text x="146" y="640" class="s" font-size="21" font-style="italic" fill="#94a3b8">Someone is home</text>
<rect x="146" y="664" width="274" height="40" rx="8" fill="#60a5fa" fill-opacity="0.13" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="160" y="690" class="m" font-size="19" fill="#e2e8f0">listen_addresses = &#x27;*&#x27;</text>
<rect x="600" y="570" width="416" height="136" rx="12" fill="#2a1418" stroke="#f87171" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="620" y="602" class="m" font-size="15" font-weight="700" fill="#f87171" letter-spacing="2">IF IT FAILS</text>
<text x="620" y="640" class="m" font-size="21" font-weight="700" fill="#fecaca">Connection refused</text>
<text x="620" y="676" class="s" font-size="19" font-style="italic" fill="#fca5a5">fails instantly</text>
<path d="M92,738 L100,756 L108,738" fill="none" stroke="#475569" stroke-width="3"/>
<rect x="40" y="758" width="1000" height="196" rx="18" fill="#111c33" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="2"/>
<rect x="40" y="758" width="10" height="196" rx="5" fill="#a78bfa"/>
<circle cx="100" cy="810" r="27" fill="#a78bfa"/>
<text x="100" y="820" text-anchor="middle" class="s" font-size="28" font-weight="800" fill="#0b1220">3</text>
<text x="146" y="820" class="s" font-size="31" font-weight="700" fill="#f8fafc">pg_hba.conf</text>
<text x="146" y="858" class="s" font-size="21" font-style="italic" fill="#94a3b8">Your name is on the visitor list</text>
<rect x="146" y="882" width="319" height="40" rx="8" fill="#a78bfa" fill-opacity="0.13" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="160" y="908" class="m" font-size="19" fill="#e2e8f0">app → mydb from app server</text>
<rect x="600" y="788" width="416" height="136" rx="12" fill="#2a1418" stroke="#f87171" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="620" y="820" class="m" font-size="15" font-weight="700" fill="#f87171" letter-spacing="2">IF IT FAILS</text>
<text x="620" y="858" class="m" font-size="21" font-weight="700" fill="#fecaca">no pg_hba.conf entry</text>
<text x="620" y="894" class="s" font-size="19" font-style="italic" fill="#fca5a5">Postgres answered: no</text>
<path d="M92,956 L100,974 L108,956" fill="none" stroke="#475569" stroke-width="3"/>
<rect x="40" y="976" width="1000" height="196" rx="18" fill="#111c33" stroke="#4ade80" stroke-opacity="0.5" stroke-width="2"/>
<rect x="40" y="976" width="10" height="196" rx="5" fill="#4ade80"/>
<circle cx="100" cy="1028" r="27" fill="#4ade80"/>
<text x="100" y="1038" text-anchor="middle" class="s" font-size="28" font-weight="800" fill="#0b1220">4</text>
<text x="146" y="1038" class="s" font-size="31" font-weight="700" fill="#f8fafc">Username + password</text>
<text x="146" y="1076" class="s" font-size="21" font-style="italic" fill="#94a3b8">You know the password</text>
<rect x="146" y="1100" width="297" height="40" rx="8" fill="#4ade80" fill-opacity="0.13" stroke="#4ade80" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="160" y="1126" class="m" font-size="19" fill="#e2e8f0">psql -h 10.0.2.40 -U app</text>
<rect x="600" y="1006" width="416" height="136" rx="12" fill="#2a1418" stroke="#f87171" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="620" y="1038" class="m" font-size="15" font-weight="700" fill="#f87171" letter-spacing="2">IF IT FAILS</text>
<text x="620" y="1076" class="m" font-size="19" font-weight="700" fill="#fecaca">password authentication failed</text>
<text x="620" y="1112" class="s" font-size="19" font-style="italic" fill="#fca5a5">got all the way to login</text>
<text x="40" y="1224" class="s" font-size="26" font-weight="700" fill="#f8fafc">The further down your error, the more already works.</text>
<text x="40" y="1262" class="s" font-size="25" fill="#94a3b8">A password error means gates 1–3 are fine.</text>
</svg>